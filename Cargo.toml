[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/client",
    "crates/cli",
    "crates/desktop",
    "crates/e2e",
]

# Сквозные тесты не входят в обычные `cargo build` и `cargo test`.
default-members = [
    "crates/protocol",
    "crates/server",
    "crates/client",
    "crates/cli",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
