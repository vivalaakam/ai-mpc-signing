[package]
name = "ai-signing-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ai-signing-cli"

[[bin]]
name = "ai-signing-cli"
path = "src/main.rs"

[[bin]]
name = "ai-signing-admin"
path = "src/admin.rs"

[[bin]]
name = "ai-signing-auto"
path = "src/auto.rs"

[dependencies]
ai-signing-client = { path = "../client" }
ai-signing-protocol = { path = "../protocol" }
arboard = "3"
async-channel = "2"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = "1"
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
