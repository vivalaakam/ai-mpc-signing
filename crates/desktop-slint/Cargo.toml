[package]
name = "ai-signing-desktop-slint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ai_signing_desktop_slint"
path = "src/lib.rs"

[[bin]]
name = "ai-signing-gui-slint"
path = "src/main.rs"

[dependencies]
ai-signing-client = { path = "../client" }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "=1.18.1"
uuid = { version = "1", features = ["serde"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = []
# Headless controller bootstrap for ai-signing-e2e (JSON test scripts, no window).
test-harness = []

[build-dependencies]
slint-build = "=1.18.1"
